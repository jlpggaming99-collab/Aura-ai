<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Aura AI · Gemini Chatbot</title>
    <!-- Google Fonts + Font Awesome 6 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(ellipse at 30% 10%, #0a0f1e, #03050b);
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.2rem;
        }

        .aura-container {
            max-width: 1100px;
            width: 100%;
            background: rgba(15, 22, 36, 0.6);
            backdrop-filter: blur(18px);
            border-radius: 2.5rem;
            border: 1px solid rgba(139, 92, 246, 0.35);
            box-shadow: 0 30px 50px -20px rgba(0, 0, 0, 0.6);
            overflow: hidden;
        }

        .aura-header {
            background: linear-gradient(135deg, rgba(20, 28, 50, 0.9), rgba(10, 15, 30, 0.95));
            padding: 1rem 1.8rem;
            border-bottom: 1px solid rgba(139, 92, 246, 0.4);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .aura-icon {
            background: linear-gradient(145deg, #8b5cf6, #6366f1);
            width: 42px;
            height: 42px;
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .aura-icon i {
            font-size: 1.6rem;
            color: white;
        }

        .brand h1 {
            font-size: 1.7rem;
            font-weight: 700;
            background: linear-gradient(130deg, #e0e7ff, #c4b5fd, #a78bfa);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .brand span {
            font-size: 0.75rem;
            background: rgba(139, 92, 246, 0.2);
            padding: 0.2rem 0.7rem;
            border-radius: 40px;
            color: #c4b5fd;
        }

        .led-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
        }

        .led {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ef4444;
            transition: all 0.2s;
        }

        .led.active {
            background: #10b981;
            box-shadow: 0 0 10px #10b981;
        }

        .action-btn {
            background: transparent;
            border: none;
            color: #a5b4fc;
            cursor: pointer;
            padding: 0.3rem 0.7rem;
            border-radius: 30px;
        }

        .action-btn:hover {
            background: #2d3a5e50;
            color: white;
        }

        .chat-messages {
            height: 450px;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            background: rgba(5, 10, 22, 0.3);
        }

        .chat-messages::-webkit-scrollbar {
            width: 5px;
        }
        .chat-messages::-webkit-scrollbar-track {
            background: #1e293b;
            border-radius: 10px;
        }
        .chat-messages::-webkit-scrollbar-thumb {
            background: #8b5cf6;
            border-radius: 10px;
        }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 80%;
            animation: floatUp 0.3s ease;
        }

        .user-msg {
            align-self: flex-end;
        }

        .ai-msg {
            align-self: flex-start;
        }

        .bubble {
            padding: 0.9rem 1.3rem;
            border-radius: 1.8rem;
            line-height: 1.5;
            font-size: 0.95rem;
            word-wrap: break-word;
        }

        .user-msg .bubble {
            background: linear-gradient(145deg, #4f46e5, #6366f1);
            color: white;
            border-bottom-right-radius: 0.3rem;
        }

        .ai-msg .bubble {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(139, 92, 246, 0.4);
            color: #f1f5f9;
            border-bottom-left-radius: 0.3rem;
        }

        .msg-time {
            font-size: 0.65rem;
            margin: 0.2rem 0.6rem;
            color: #7e8ba3;
        }

        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 0.6rem 1.2rem;
            background: rgba(30, 41, 59, 0.6);
            border-radius: 2rem;
            width: fit-content;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #a78bfa;
            border-radius: 50%;
            animation: wave 1.3s infinite;
        }

        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes wave {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
            30% { transform: translateY(-6px); opacity: 1; }
        }

        @keyframes floatUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .input-panel {
            background: rgba(8, 12, 24, 0.8);
            padding: 1.2rem 1.8rem 1.5rem;
            border-top: 1px solid rgba(139, 92, 246, 0.2);
        }

        .composer {
            display: flex;
            gap: 0.8rem;
            align-items: flex-end;
        }

        .composer textarea {
            flex: 1;
            background: #111827;
            border: 1px solid #2d3a5e;
            border-radius: 2rem;
            padding: 0.85rem 1.3rem;
            font-family: 'Inter', monospace;
            font-size: 0.9rem;
            color: #f1f5f9;
            resize: none;
            outline: none;
            max-height: 120px;
        }

        .composer textarea:focus {
            border-color: #a78bfa;
        }

        .send-btn {
            background: radial-gradient(circle at 30% 10%, #8b5cf6, #4f46e5);
            width: 52px;
            height: 52px;
            border-radius: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            cursor: pointer;
            transition: 0.2s;
        }

        .send-btn:hover {
            transform: scale(1.05);
        }

        .send-btn i {
            font-size: 1.4rem;
            color: white;
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .info-footer {
            text-align: center;
            font-size: 0.7rem;
            margin-top: 0.7rem;
            color: #5f6c8c;
            display: flex;
            justify-content: space-between;
        }

        .error-toast {
            background: #7f1a1aee;
            border-left: 4px solid #f97316;
            padding: 0.5rem 1rem;
            border-radius: 14px;
            font-size: 0.75rem;
            margin-bottom: 0.8rem;
            color: #ffe4e2;
            display: none;
        }
    </style>
</head>
<body>

<div class="aura-container">
    <div class="aura-header">
        <div class="brand">
            <div class="aura-icon">
                <i class="fas fa-gem"></i>
            </div>
            <h1>AURA AI <span>by JLPG</span></h1>
        </div>
        <div style="display: flex; gap: 15px; align-items: center;">
            <div class="led-status">
                <div class="led" id="ledDot"></div>
                <span id="keyStateText">Ready</span>
            </div>
            <button class="action-btn" id="clearHistoryBtn"><i class="fas fa-eraser"></i> Clear</button>
        </div>
    </div>

    <div class="chat-messages" id="chatMessages"></div>

    <div class="input-panel">
        <div id="globalError" class="error-toast"></div>
        <div class="composer">
            <textarea id="userMsgInput" rows="1" placeholder="Ask Aura AI anything..."></textarea>
            <button class="send-btn" id="sendMsgBtn"><i class="fas fa-paper-plane"></i></button>
        </div>
        <div class="info-footer">
            <span><i class="fas fa-brain"></i> Powered by Google Gemini</span>
            <span><i class="fas fa-shield-alt"></i> Free · Private</span>
        </div>
    </div>
</div>

<script>
    // ============================================
    // ✅ API KEY ADDED (Aapki di hui key)
    // ============================================
    let API_KEY = "AQ.Ab8RN6LVCT4BLx0alFVsvP_jm4gBP3_DPlGReK6tnf8sg1LOlw";
    
    // ============================================
    
    const GEMINI_URL = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent";
    
    const messagesDiv = document.getElementById('chatMessages');
    const userInput = document.getElementById('userMsgInput');
    const sendBtn = document.getElementById('sendMsgBtn');
    const clearBtn = document.getElementById('clearHistoryBtn');
    const ledDot = document.getElementById('ledDot');
    const keyStateSpan = document.getElementById('keyStateText');
    const errorToast = document.getElementById('globalError');
    
    let conversationHistory = [];
    let isLoading = false;
    
    function showError(msg, duration = 4000) {
        errorToast.innerText = msg;
        errorToast.style.display = "block";
        setTimeout(() => {
            if (errorToast.innerText === msg) errorToast.style.display = "none";
        }, duration);
    }
    
    function updateKeyUI() {
        if (API_KEY && API_KEY.length > 10) {
            ledDot.classList.add("active");
            keyStateSpan.innerHTML = '<i class="fas fa-check-circle"></i> Active';
            keyStateSpan.style.color = "#a7f3d0";
            sendBtn.disabled = false;
            userInput.disabled = false;
            userInput.placeholder = "✨ Ask Aura AI ...";
        } else {
            ledDot.classList.remove("active");
            keyStateSpan.innerHTML = '⚠️ No Key';
            keyStateSpan.style.color = "#fbcfe8";
            sendBtn.disabled = true;
            userInput.disabled = true;
            userInput.placeholder = "🔐 API key missing!";
        }
    }
    
    function loadConversation() {
        const saved = localStorage.getItem("aura_conversation");
        if (saved) {
            try {
                let parsed = JSON.parse(saved);
                if (Array.isArray(parsed) && parsed.length > 0) {
                    conversationHistory = parsed;
                    renderMessages();
                    return;
                }
            } catch(e) {}
        }
        conversationHistory = [
            { role: "model", content: "✨ Namaste! I'm **Aura AI** — created by JLPG. I'm powered by **Google Gemini AI**. Ask me anything — coding, writing, ideas, or just casual chat! 😊" }
        ];
        renderMessages();
        saveConversation();
    }
    
    function saveConversation() {
        localStorage.setItem("aura_conversation", JSON.stringify(conversationHistory));
    }
    
    function renderMessages() {
        messagesDiv.innerHTML = "";
        for (let msg of conversationHistory) {
            const msgDiv = document.createElement("div");
            msgDiv.classList.add("message");
            if (msg.role === "user") {
                msgDiv.classList.add("user-msg");
            } else {
                msgDiv.classList.add("ai-msg");
            }
            const bubble = document.createElement("div");
            bubble.classList.add("bubble");
            if (msg.role === "model") {
                let content = msg.content.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");
                content = content.replace(/\n/g, "<br>");
                bubble.innerHTML = content;
            } else {
                bubble.textContent = msg.content;
            }
            const timeSpan = document.createElement("div");
            timeSpan.classList.add("msg-time");
            const now = new Date();
            timeSpan.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            msgDiv.appendChild(bubble);
            msgDiv.appendChild(timeSpan);
            messagesDiv.appendChild(msgDiv);
        }
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }
    
    function addMessage(role, content) {
        conversationHistory.push({ role, content });
        renderMessages();
        saveConversation();
    }
    
    function clearChat() {
        conversationHistory = [
            { role: "model", content: "🧹 Conversation cleared! Aura AI is ready for your next question. Ask away! ✨" }
        ];
        renderMessages();
        saveConversation();
        showError("Chat history cleared!", 1500);
    }
    
    let typingElement = null;
    function showTyping() {
        if (typingElement) removeTyping();
        const indicatorDiv = document.createElement("div");
        indicatorDiv.classList.add("message", "ai-msg");
        indicatorDiv.id = "typingIndicator";
        const bubbleWrap = document.createElement("div");
        bubbleWrap.classList.add("typing-indicator");
        bubbleWrap.innerHTML = `<span></span><span></span><span></span><span style="margin-left:8px; font-size:0.7rem;">Aura is thinking...</span>`;
        indicatorDiv.appendChild(bubbleWrap);
        messagesDiv.appendChild(indicatorDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
        typingElement = indicatorDiv;
    }
    
    function removeTyping() {
        if (typingElement) {
            typingElement.remove();
            typingElement = null;
        }
    }
    
    async function sendToGemini(userMessage) {
        if (!API_KEY) {
            showError("API key missing!");
            return null;
        }
        
        const historyContext = conversationHistory.slice(-10).map(msg => ({
            role: msg.role === "user" ? "user" : "model",
            parts: [{ text: msg.content }]
        }));
        
        const requestBody = {
            contents: [
                ...historyContext,
                { role: "user", parts: [{ text: userMessage }] }
            ],
            generationConfig: {
                temperature: 0.7,
                maxOutputTokens: 800,
                topP: 0.95
            }
        };
        
        try {
            const response = await fetch(`${GEMINI_URL}?key=${API_KEY}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(requestBody)
            });
            
            if (!response.ok) {
                let errorDetail = "";
                try {
                    const errData = await response.json();
                    errorDetail = errData.error?.message || JSON.stringify(errData);
                } catch(e) { errorDetail = `HTTP ${response.status}`; }
                throw new Error(`Gemini error: ${errorDetail}`);
            }
            
            const data = await response.json();
            const aiText = data.candidates?.[0]?.content?.parts?.[0]?.text;
            if (!aiText) throw new Error("Empty response");
            return aiText;
        } catch (err) {
            console.error(err);
            let friendly = `❌ Error: ${err.message}`;
            if (err.message.includes("API key") || err.message.includes("403")) {
                friendly = "🔐 API key issue. Please check your key is valid.";
            } else if (err.message.includes("429")) {
                friendly = "⏳ Rate limit exceeded. Please try again in a moment.";
            }
            return friendly;
        }
    }
    
    async function handleSendMessage() {
        if (isLoading) return;
        const rawMsg = userInput.value.trim();
        if (!rawMsg) return;
        
        addMessage("user", rawMsg);
        userInput.value = "";
        userInput.style.height = "auto";
        
        isLoading = true;
        sendBtn.disabled = true;
        showTyping();
        
        const aiReply = await sendToGemini(rawMsg);
        
        removeTyping();
        
        if (aiReply) {
            addMessage("model", aiReply);
        } else {
            addMessage("model", "⚠️ Aura couldn't respond. Please try again.");
        }
        
        isLoading = false;
        sendBtn.disabled = false;
        userInput.focus();
    }
    
    function autoResize() {
        userInput.style.height = "auto";
        userInput.style.height = Math.min(120, userInput.scrollHeight) + "px";
    }
    
    sendBtn.addEventListener("click", handleSendMessage);
    clearBtn.addEventListener("click", clearChat);
    userInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            if (!isLoading && sendBtn.disabled === false) handleSendMessage();
        }
    });
    userInput.addEventListener("input", autoResize);
    
    updateKeyUI();
    loadConversation();
    autoResize();
</script>
</body>
</html>
