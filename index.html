<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aura AI</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f172a;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.chat-container{
width:95%;
max-width:900px;
height:90vh;
background:#111827;
border-radius:20px;
overflow:hidden;
box-shadow:0 0 30px rgba(0,255,255,.2);
display:flex;
flex-direction:column;
}

.header{
background:linear-gradient(90deg,#00c6ff,#0072ff);
padding:15px;
text-align:center;
color:white;
}

.header h1{
font-size:28px;
}

.header p{
font-size:14px;
opacity:.9;
}

.chat-box{
flex:1;
padding:20px;
overflow-y:auto;
}

.message{
margin:10px 0;
padding:12px 15px;
border-radius:15px;
max-width:80%;
}

.user{
background:#2563eb;
color:white;
margin-left:auto;
}

.bot{
background:#1f2937;
color:white;
}

.input-area{
display:flex;
padding:15px;
background:#0b1220;
}

input{
flex:1;
padding:15px;
border:none;
border-radius:12px;
outline:none;
font-size:16px;
}

button{
margin-left:10px;
padding:15px 25px;
border:none;
border-radius:12px;
background:#00c6ff;
color:white;
font-weight:bold;
cursor:pointer;
}

button:hover{
opacity:.8;
}

.footer{
text-align:center;
padding:10px;
color:#9ca3af;
font-size:13px;
}
</style>
</head>
<body>

<div class="chat-container">

<div class="header">
<h1>✨ Aura AI</h1>
<p>Your Smart AI Assistant</p>
</div>

<div class="chat-box" id="chatBox">
<div class="message bot">
👋 Hello! I am Aura AI. How can I help you today?
</div>
</div>

<div class="input-area">
<input type="text" id="message" placeholder="Type your message...">
<button onclick="sendMessage()">Send</button>
</div>

<div class="footer">
Made by JLPG 🚀
</div>

</div>

<script>
const API_KEY = "AQ.Ab8RN6LE5xnxiBkABNiwVfsnleHFowNkFb6q7hWBbFAY5gPzzw";

async function sendMessage(){

const input = document.getElementById("message");
const text = input.value;

if(!text) return;

const chatBox = document.getElementById("chatBox");

chatBox.innerHTML += `
<div class="message user">${text}</div>
`;

input.value="";

const response = await fetch(
`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${API_KEY}`,
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
contents:[{
parts:[{text:text}]
}]
})
}
);

const data = await response.json();

const reply =
data.candidates?.[0]?.content?.parts?.[0]?.text ||
"Sorry, I couldn't respond.";

chatBox.innerHTML += `
<div class="message bot">${reply}</div>
`;

chatBox.scrollTop = chatBox.scrollHeight;
}
</script>

</body>
</html>
