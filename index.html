<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Centra Academy - Student Chat Room</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app-container {
            width: 100%;
            max-width: 550px;
            background: white;
            border-radius: 25px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 90vh;
        }

        .header {
            background: #0f2027;
            color: white;
            padding: 18px;
            text-align: center;
        }

        .header h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 0.8rem;
            opacity: 0.9;
        }

        .screen {
            flex: 1;
            display: none;
            flex-direction: column;
            padding: 25px 20px;
            overflow-y: auto;
        }

        .screen.active {
            display: flex;
        }

        .chat-screen {
            padding: 0;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #0f2027;
            font-size: 1.3rem;
        }

        h3 {
            font-size: 1rem;
            margin-bottom: 10px;
            color: #2a5298;
        }

        input {
            padding: 14px;
            font-size: 1rem;
            border: 2px solid #ddd;
            border-radius: 12px;
            margin-bottom: 15px;
            outline: none;
            width: 100%;
        }

        input:focus {
            border-color: #2a5298;
        }

        button {
            background: #2a5298;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
        }

        button:hover {
            background: #1e3c72;
            transform: scale(1.02);
        }

        .create-section, .join-section {
            background: #f0f4ff;
            padding: 18px;
            border-radius: 15px;
            margin-bottom: 20px;
            border: 1px solid #cbd5e0;
        }

        .error-msg {
            text-align: center;
            margin-top: 10px;
            font-size: 0.85rem;
            color: #e74c3c;
        }

        .success-msg {
            text-align: center;
            margin-top: 10px;
            font-size: 0.85rem;
            color: #27ae60;
        }

        .room-list {
            max-height: 200px;
            overflow-y: auto;
            margin-top: 10px;
        }

        .room-item {
            background: white;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #ddd;
        }

        .room-item strong {
            color: #2a5298;
        }

        .room-item button {
            width: auto;
            padding: 6px 15px;
            margin: 0;
            font-size: 0.8rem;
        }

        .chat-header {
            background: #0f2027;
            color: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .chat-header button {
            width: auto;
            padding: 6px 12px;
            font-size: 0.8rem;
            margin: 0;
        }

        .exit-btn {
            background: #e74c3c;
        }

        .master-btn {
            background: #f39c12;
        }

        .room-info {
            font-size: 0.75rem;
            text-align: center;
            padding: 8px;
            background: #bdc3c7;
            color: #2c3e50;
            font-weight: bold;
        }

        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            background: #ecf0f1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            background: white;
            padding: 10px 15px;
            border-radius: 18px;
            max-width: 80%;
            word-wrap: break-word;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        .message.own {
            background: #2a5298;
            color: white;
            align-self: flex-end;
        }

        .message.master {
            background: #f39c12;
            color: #333;
            align-self: flex-start;
            border: 2px solid #e67e22;
        }

        .message-username {
            font-weight: bold;
            font-size: 0.8rem;
            margin-bottom: 4px;
            color: #2c3e50;
        }

        .message.own .message-username {
            color: #ffd966;
        }

        .message.master .message-username {
            color: #c0392b;
        }

        .message-text {
            font-size: 0.95rem;
        }

        .message-time {
            font-size: 0.7rem;
            margin-top: 4px;
            opacity: 0.7;
            text-align: right;
        }

        .input-area {
            display: flex;
            padding: 15px;
            background: white;
            border-top: 1px solid #ddd;
            gap: 10px;
        }

        .message-input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 25px;
            outline: none;
            margin: 0;
        }

        .send-btn {
            width: auto;
            padding: 10px 20px;
            margin: 0;
        }

        .footer {
            text-align: center;
            padding: 8px;
            font-size: 0.7rem;
            color: #7f8c8d;
            background: #f9f9f9;
            border-top: 1px solid #eee;
        }

        .back-btn {
            background: #95a5a6;
            margin-top: 10px;
        }

        .master-controls {
            background: #fff3cd;
            padding: 12px;
            border-radius: 12px;
            margin-top: 10px;
            border: 1px solid #ffc107;
        }

        .master-controls h4 {
            color: #e17055;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        .master-controls button {
            background: #e17055;
            margin-bottom: 8px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="header">
        <h1>🏫 Centra Academy</h1>
        <p>Student Chat Room</p>
    </div>

    <!-- Main Menu Screen -->
    <div id="mainMenuScreen" class="screen active">
        <div class="create-section">
            <h3>✨ Create New Room</h3>
            <input type="text" id="newRoomName" placeholder="Room Name (e.g., Class 10 Science)">
            <input type="password" id="newRoomPassword" placeholder="Set Room Password">
            <input type="text" id="creatorName" placeholder="Your Name">
            <button id="createRoomBtn">➕ Create Room</button>
            <div id="createErrorMsg" class="error-msg"></div>
        </div>

        <div class="join-section">
            <h3>🔐 Join Existing Room</h3>
            <div id="roomsList" class="room-list">
                <div style="text-align: center; color: #999;">No rooms yet. Create one above!</div>
            </div>
        </div>
    </div>

    <!-- Join Room Screen (Password Entry) -->
    <div id="joinScreen" class="screen">
        <h2>🔐 Join: <span id="selectedRoomName"></span></h2>
        <input type="text" id="joinUserName" placeholder="Your Name">
        <input type="password" id="joinPassword" placeholder="Room Password">
        <button id="confirmJoinBtn">Join Room ➡️</button>
        <button id="backToMenuBtn" class="back-btn">◀ Back</button>
        <div id="joinErrorMsg" class="error-msg"></div>
    </div>

    <!-- Chat Screen -->
    <div id="chatScreen" class="screen chat-screen">
        <div class="chat-header">
            <span>💬 <span id="currentRoomName"></span></span>
            <div>
                <button id="masterControlsBtn" class="master-btn hidden">👑 Master</button>
                <button id="exitRoomBtn" class="exit-btn">🚪 Exit</button>
            </div>
        </div>
        <div class="room-info">
            🔐 Be Respectful | Enjoy Chatting
        </div>
        <div id="messagesArea" class="messages-area">
            <div class="message" style="background: #ffeaa7; align-self: center; text-align: center;">
                🤖 Welcome to Centra Academy Chat Room
            </div>
        </div>
        <div class="input-area">
            <input type="text" id="messageInput" class="message-input" placeholder="Type your message...">
            <button id="sendBtn" class="send-btn">Send 📨</button>
        </div>
    </div>

    <!-- Master Controls Panel (Hidden by default) -->
    <div id="masterControlsPanel" class="screen">
        <h2>👑 Master Controls</h2>
        <div id="currentRoomMasterInfo" style="background:#f0f4ff; padding:12px; border-radius:12px; margin-bottom:15px;">
            <strong>Room: <span id="masterRoomName"></span></strong>
        </div>
        <button id="masterChangePasswordBtn">🔑 Change Room Password</button>
        <button id="masterDeleteRoomBtn">🗑️ Delete This Room</button>
        <button id="masterViewAllRoomsBtn">📋 View All Rooms</button>
        <button id="closeMasterPanelBtn" class="back-btn">◀ Close</button>
        <div id="masterActionMsg" class="success-msg"></div>
    </div>

    <!-- View All Rooms Screen (Master) -->
    <div id="masterAllRoomsScreen" class="screen">
        <h2>📋 All Rooms (Master View)</h2>
        <div id="masterRoomsList" class="room-list"></div>
        <button id="backFromMasterRoomsBtn" class="back-btn">◀ Back</button>
    </div>

    <div class="footer">
        Made by JLPG
    </div>
</div>

<script>
    // MASTER PASSWORD - HIDDEN, NEVER SHOWN ANYWHERE
    const MASTER_PASSWORD = "jay123";
    
    let rooms = [];
    let currentUser = { name: "", currentRoomId: null, isMaster: false };
    let currentRoom = null;
    let currentMessages = [];
    let nextRoomId = 1;
    
    // Load from localStorage
    function loadData() {
        const saved = localStorage.getItem("centra_academy_rooms");
        if (saved) {
            rooms = JSON.parse(saved);
            nextRoomId = rooms.length > 0 ? Math.max(...rooms.map(r => r.id)) + 1 : 1;
            rooms.forEach(room => {
                const savedMsgs = localStorage.getItem(`centra_msgs_${room.id}`);
                room.messages = savedMsgs ? JSON.parse(savedMsgs) : [];
            });
        } else {
            rooms = [];
        }
        updateRoomsList();
    }
    
    function saveRooms() {
        const roomsToSave = rooms.map(room => ({
            id: room.id,
            name: room.name,
            password: room.password,
            creator: room.creator,
            createdAt: room.createdAt
        }));
        localStorage.setItem("centra_academy_rooms", JSON.stringify(roomsToSave));
        rooms.forEach(room => {
            localStorage.setItem(`centra_msgs_${room.id}`, JSON.stringify(room.messages || []));
        });
    }
    
    function updateRoomsList() {
        const container = document.getElementById('roomsList');
        if (!container) return;
        
        if (rooms.length === 0) {
            container.innerHTML = '<div style="text-align: center; color: #999;">No rooms yet. Create one above!</div>';
            return;
        }
        
        container.innerHTML = '';
        rooms.forEach(room => {
            const div = document.createElement('div');
            div.className = 'room-item';
            div.innerHTML = `
                <div>
                    <strong>${escapeHtml(room.name)}</strong><br>
                    <small style="color:#666;">By: ${escapeHtml(room.creator)}</small>
                </div>
                <button onclick="selectRoom(${room.id})">Join</button>
            `;
            container.appendChild(div);
        });
    }
    
    function updateMasterRoomsList() {
        const container = document.getElementById('masterRoomsList');
        if (!container) return;
        
        if (rooms.length === 0) {
            container.innerHTML = '<div style="text-align: center; color: #999;">No rooms found.</div>';
            return;
        }
        
        container.innerHTML = '';
        rooms.forEach(room => {
            const div = document.createElement('div');
            div.className = 'room-item';
            div.innerHTML = `
                <div>
                    <strong>${escapeHtml(room.name)}</strong><br>
                    <small>Creator: ${escapeHtml(room.creator)} | Password: ******</small>
                </div>
                <div style="display: flex; gap: 5px;">
                    <button onclick="masterJoinSpecificRoom(${room.id})">Enter</button>
                    <button onclick="masterChangeRoomPassword(${room.id})" style="background:#f39c12;">Change PW</button>
                    <button onclick="masterDeleteSpecificRoom(${room.id})" style="background:#e74c3c;">Delete</button>
                </div>
            `;
            container.appendChild(div);
        });
    }
    
    window.selectRoom = function(roomId) {
        const room = rooms.find(r => r.id === roomId);
        if (room) {
            document.getElementById('selectedRoomName').innerText = room.name;
            document.getElementById('joinScreen').dataset.selectedRoomId = roomId;
            showScreen('joinScreen');
        }
    };
    
    window.masterJoinSpecificRoom = function(roomId) {
        const room = rooms.find(r => r.id === roomId);
        if (room) {
            currentUser = { name: "👑 Master", currentRoomId: room.id, isMaster: true };
            enterChatRoom(room);
        }
        showScreen('chatScreen');
    };
    
    window.masterChangeRoomPassword = function(roomId) {
        const room = rooms.find(r => r.id === roomId);
        if (room) {
            const newPw = prompt(`Room: ${room.name}\nCurrent Password: ${room.password}\nEnter NEW password:`);
            if (newPw && newPw.trim() !== "") {
                room.password = newPw.trim();
                saveRooms();
                updateMasterRoomsList();
                showMasterActionMsg(`✅ Password changed for ${room.name}`);
            }
        }
    };
    
    window.masterDeleteSpecificRoom = function(roomId) {
        if (confirm("⚠️ Delete this room permanently? All messages will be lost!")) {
            const index = rooms.findIndex(r => r.id === roomId);
            if (index !== -1) {
                localStorage.removeItem(`centra_msgs_${roomId}`);
                rooms.splice(index, 1);
                saveRooms();
                updateRoomsList();
                updateMasterRoomsList();
                showMasterActionMsg("✅ Room deleted successfully!");
                if (currentRoom && currentRoom.id === roomId) {
                    exitToMainMenu();
                }
            }
        }
    };
    
    function showMasterActionMsg(msg) {
        const msgDiv = document.getElementById('masterActionMsg');
        if (msgDiv) {
            msgDiv.innerText = msg;
            setTimeout(() => msgDiv.innerText = "", 2000);
        }
    }
    
    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(screen => {
            screen.classList.remove('active');
        });
        document.getElementById(screenId).classList.add('active');
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    function renderMessages() {
        const container = document.getElementById('messagesArea');
        if (!container) return;
        
        const msgs = currentMessages || [];
        container.innerHTML = '';
        if (msgs.length === 0) {
            container.innerHTML = '<div class="message" style="background: #ffeaa7; align-self: center; text-align: center;">🤖 No messages yet. Say something!</div>';
            return;
        }
        
        msgs.forEach(msg => {
            const msgDiv = document.createElement('div');
            let msgClass = 'message';
            if (msg.sender === currentUser.name) {
                msgClass += ' own';
            }
            if (msg.isMaster) {
                msgClass += ' master';
            }
            msgDiv.className = msgClass;
            msgDiv.innerHTML = `
                <div class="message-username">${escapeHtml(msg.sender)} ${msg.isMaster ? '👑' : ''}</div>
                <div class="message-text">${escapeHtml(msg.text)}</div>
                <div class="message-time">${msg.time}</div>
            `;
            container.appendChild(msgDiv);
        });
        container.scrollTop = container.scrollHeight;
    }
    
    function addMessage(sender, text, isMaster = false) {
        const now = new Date();
        const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const msg = { sender, text, time: timeStr, isMaster };
        currentMessages.push(msg);
        if (currentRoom) {
            currentRoom.messages = currentMessages;
            saveRooms();
        }
        renderMessages();
    }
    
    function enterChatRoom(room) {
        currentRoom = room;
        currentMessages = room.messages || [];
        currentUser.currentRoomId = room.id;
        document.getElementById('currentRoomName').innerText = room.name;
        
        // Show master controls button if user is master
        if (currentUser.isMaster) {
            document.getElementById('masterControlsBtn').classList.remove('hidden');
        } else {
            document.getElementById('masterControlsBtn').classList.add('hidden');
        }
        
        renderMessages();
        
        const lastMsg = currentMessages[currentMessages.length - 1];
        if (!lastMsg || !lastMsg.text.includes(`${currentUser.name} joined`)) {
            addMessage("System", `✨ ${currentUser.name} joined the room! ✨`, false);
        }
        
        showScreen('chatScreen');
    }
    
    function exitToMainMenu() {
        if (currentUser.name && currentRoom) {
            addMessage("System", `${currentUser.name} left the room.`, false);
        }
        currentUser = { name: "", currentRoomId: null, isMaster: false };
        currentRoom = null;
        currentMessages = [];
        showScreen('mainMenuScreen');
        updateRoomsList();
    }
    
    // Event Listeners
    document.getElementById('createRoomBtn').addEventListener('click', () => {
        const roomName = document.getElementById('newRoomName').value.trim();
        const roomPassword = document.getElementById('newRoomPassword').value.trim();
        const creator = document.getElementById('creatorName').value.trim();
        const errorDiv = document.getElementById('createErrorMsg');
        
        if (!roomName) {
            errorDiv.innerText = "❌ Enter room name!";
            return;
        }
        if (!roomPassword) {
            errorDiv.innerText = "❌ Set a password for the room!";
            return;
        }
        if (!creator) {
            errorDiv.innerText = "❌ Enter your name!";
            return;
        }
        if (rooms.find(r => r.name.toLowerCase() === roomName.toLowerCase())) {
            errorDiv.innerText = "❌ Room name already exists!";
            return;
        }
        
        const newRoom = {
            id: nextRoomId++,
            name: roomName,
            password: roomPassword,
            creator: creator,
            createdAt: new Date().toLocaleString(),
            messages: []
        };
        rooms.push(newRoom);
        saveRooms();
        updateRoomsList();
        
        document.getElementById('newRoomName').value = '';
        document.getElementById('newRoomPassword').value = '';
        document.getElementById('creatorName').value = '';
        errorDiv.innerText = "✅ Room created successfully!";
        setTimeout(() => errorDiv.innerText = "", 2000);
    });
    
    document.getElementById('confirmJoinBtn').addEventListener('click', () => {
        const roomId = parseInt(document.getElementById('joinScreen').dataset.selectedRoomId);
        const room = rooms.find(r => r.id === roomId);
        const userName = document.getElementById('joinUserName').value.trim();
        const enteredPassword = document.getElementById('joinPassword').value.trim();
        const errorDiv = document.getElementById('joinErrorMsg');
        
        if (!room) {
            errorDiv.innerText = "Room not found!";
            return;
        }
        if (!userName) {
            errorDiv.innerText = "❌ Enter your name!";
            return;
        }
        
        // CHECK FOR MASTER PASSWORD (HIDDEN FEATURE)
        if (enteredPassword === MASTER_PASSWORD) {
            // Master login - hidden feature
            currentUser = { name: userName + " 👑", currentRoomId: room.id, isMaster: true };
            document.getElementById('joinUserName').value = '';
            document.getElementById('joinPassword').value = '';
            errorDiv.innerText = "";
            enterChatRoom(room);
            addMessage("System", `🔐 Master ${userName} has entered the room!`, true);
            return;
        }
        
        // Normal user login
        if (enteredPassword !== room.password) {
            errorDiv.innerText = "❌ Wrong room password!";
            return;
        }
        
        currentUser = { name: userName, currentRoomId: room.id, isMaster: false };
        
        document.getElementById('joinUserName').value = '';
        document.getElementById('joinPassword').value = '';
        errorDiv.innerText = "";
        
        enterChatRoom(room);
    });
    
    // Master Controls Button (only visible to masters)
    document.getElementById('masterControlsBtn').addEventListener('click', () => {
        if (currentUser.isMaster && currentRoom) {
            document.getElementById('masterRoomName').innerText = currentRoom.name;
            showScreen('masterControlsPanel');
        }
    });
    
    document.getElementById('masterChangePasswordBtn').addEventListener('click', () => {
        if (currentUser.isMaster && currentRoom) {
            const newPw = prompt(`Current Room Password: ${currentRoom.password}\nEnter NEW password for students:`);
            if (newPw && newPw.trim() !== "") {
                currentRoom.password = newPw.trim();
                saveRooms();
                showMasterActionMsg(`✅ Password changed to: ${newPw}`);
                addMessage("System", `🔐 Room password has been changed by Master!`, true);
            }
        }
    });
    
    document.getElementById('masterDeleteRoomBtn').addEventListener('click', () => {
        if (currentUser.isMaster && currentRoom) {
            if (confirm(`⚠️ Delete room "${currentRoom.name}" permanently?\nAll messages will be lost!`)) {
                const roomId = currentRoom.id;
                const index = rooms.findIndex(r => r.id === roomId);
                if (index !== -1) {
                    localStorage.removeItem(`centra_msgs_${roomId}`);
                    rooms.splice(index, 1);
                    saveRooms();
                    updateRoomsList();
                    exitToMainMenu();
                    alert("✅ Room deleted successfully!");
                }
            }
        }
    });
    
    document.getElementById('masterViewAllRoomsBtn').addEventListener('click', () => {
        if (currentUser.isMaster) {
            updateMasterRoomsList();
            showScreen('masterAllRoomsScreen');
        }
    });
    
    document.getElementById('closeMasterPanelBtn').addEventListener('click', () => {
        showScreen('chatScreen');
    });
    
    document.getElementById('backFromMasterRoomsBtn').addEventListener('click', () => {
        showScreen('masterControlsPanel');
    });
    
    document.getElementById('exitRoomBtn').addEventListener('click', () => {
        exitToMainMenu();
    });
    
    document.getElementById('backToMenuBtn').addEventListener('click', () => {
        document.getElementById('joinUserName').value = '';
        document.getElementById('joinPassword').value = '';
        document.getElementById('joinErrorMsg').innerText = '';
        showScreen('mainMenuScreen');
    });
    
    document.getElementById('sendBtn').addEventListener('click', () => {
        const text = document.getElementById('messageInput').value.trim();
        if (!text) return;
        addMessage(currentUser.name, text, currentUser.isMaster);
        document.getElementById('messageInput').value = '';
    });
    
    document.getElementById('messageInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') document.getElementById('sendBtn').click();
    });
    
    // Initialize
    loadData();
</script>
</body>
</html>
