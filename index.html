<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Aura AI · Gemini Intelligence</title>
    <!-- Google Fonts + Font Awesome 6 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(ellipse at 30% 10%, #0a0f1e, #03050b);
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.2rem;
        }

        /* main glass container */
        .aura-container {
            max-width: 1100px;
            width: 100%;
            background: rgba(15, 22, 36, 0.6);
            backdrop-filter: blur(18px);
            border-radius: 2.5rem;
            border: 1px solid rgba(139, 92, 246, 0.35);
            box-shadow: 0 30px 50px -20px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.03);
            overflow: hidden;
            transition: all 0.25s ease;
        }

        /* header with aura identity */
        .aura-header {
            background: linear-gradient(135deg, rgba(20, 28, 50, 0.9), rgba(10, 15, 30, 0.95));
            padding: 1rem 1.8rem;
            border-bottom: 1px solid rgba(139, 92, 246, 0.4);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .aura-icon {
            background: linear-gradient(145deg, #8b5cf6, #6366f1);
            width: 42px;
            height: 42px;
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3);
        }

        .aura-icon i {
            font-size: 1.6rem;
            color: white;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
        }

        .brand h1 {
            font-size: 1.7rem;
            font-weight: 700;
            background: linear-gradient(130deg, #e0e7ff, #c4b5fd, #a78bfa);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
        }

        .brand span {
            font-size: 0.75rem;
            background: rgba(139, 92, 246, 0.2);
            padding: 0.2rem 0.7rem;
            border-radius: 40px;
            color: #c4b5fd;
            font-weight: 500;
            margin-left: 6px;
        }

        .key-badge {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(0, 0, 0, 0.5);
            padding: 0.3rem 1rem;
            border-radius: 60px;
            backdrop-filter: blur(4px);
        }

        .led-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .led {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ef4444;
            box-shadow: 0 0 4px #ef4444;
            transition: all 0.2s;
        }

        .led.active {
            background: #10b981;
            box-shadow: 0 0 10px #10b981;
        }

        .action-btn {
            background: transparent;
            border: none;
            color: #a5b4fc;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.2s;
            padding: 0.3rem 0.7rem;
            border-radius: 30px;
        }

        .action-btn:hover {
            background: #2d3a5e50;
            color: white;
        }

        /* chat messages area */
        .chat-messages {
            height: 480px;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            background: rgba(5, 10, 22, 0.3);
            scroll-behavior: smooth;
        }

        /* custom scroll */
        .chat-messages::-webkit-scrollbar {
            width: 5px;
        }
        .chat-messages::-webkit-scrollbar-track {
            background: #1e293b;
            border-radius: 10px;
        }
        .chat-messages::-webkit-scrollbar-thumb {
            background: #8b5cf6;
            border-radius: 10px;
        }

        /* message bubbles */
        .message {
            display: flex;
            flex-direction: column;
            max-width: 80%;
            animation: floatUp 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        .user-msg {
            align-self: flex-end;
        }

        .ai-msg {
            align-self: flex-start;
        }

        .bubble {
            padding: 0.9rem 1.3rem;
            border-radius: 1.8rem;
            line-height: 1.5;
            font-size: 0.95rem;
            font-weight: 500;
            word-wrap: break-word;
            white-space: pre-wrap;
            backdrop-filter: blur(4px);
        }

        .user-msg .bubble {
            background: linear-gradient(145deg, #4f46e5, #6366f1);
            color: white;
            border-bottom-right-radius: 0.3rem;
            box-shadow: 0 6px 14px rgba(79, 70, 229, 0.3);
        }

        .ai-msg .bubble {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(139, 92, 246, 0.4);
            color: #f1f5f9;
            border-bottom-left-radius: 0.3rem;
        }

        .msg-time {
            font-size: 0.65rem;
            margin: 0.2rem 0.6rem;
            color: #7e8ba3;
            letter-spacing: 0.3px;
        }

        /* typing indicator aura style */
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 0.6rem 1.2rem;
            background: rgba(30, 41, 59, 0.6);
            border-radius: 2rem;
            width: fit-content;
            backdrop-filter: blur(8px);
        }
        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #a78bfa;
            border-radius: 50%;
            animation: wave 1.3s infinite ease-in-out;
        }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes wave {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
            30% { transform: translateY(-6px); opacity: 1; }
        }

        @keyframes floatUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* input area */
        .input-panel {
            background: rgba(8, 12, 24, 0.8);
            backdrop-filter: blur(8px);
            padding: 1.2rem 1.8rem 1.5rem;
            border-top: 1px solid rgba(139, 92, 246, 0.2);
        }

        .key-section {
            display: flex;
            gap: 0.8rem;
            margin-bottom: 1.1rem;
            flex-wrap: wrap;
        }

        .key-input-wrapper {
            flex: 3;
            position: relative;
            display: flex;
            align-items: center;
        }

        .key-input-wrapper i {
            position: absolute;
            left: 15px;
            color: #8b5cf6;
            font-size: 0.9rem;
        }

        .key-section input {
            width: 100%;
            background: #111827;
            border: 1px solid #2d3a5e;
            padding: 0.75rem 1rem 0.75rem 2.4rem;
            border-radius: 60px;
            color: #eef2ff;
            font-size: 0.85rem;
            outline: none;
            transition: 0.2s;
            font-family: monospace;
        }

        .key-section input:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 0 2px #8b5cf630;
        }

        .key-section button {
            background: linear-gradient(95deg, #4f46e5, #7c3aed);
            border: none;
            padding: 0 1.4rem;
            border-radius: 60px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .key-section button:hover {
            transform: scale(0.96);
            background: linear-gradient(95deg, #6366f1, #8b5cf6);
            box-shadow: 0 4px 12px #4f46e570;
        }

        .composer {
            display: flex;
            gap: 0.8rem;
            align-items: flex-end;
        }

        .composer textarea {
            flex: 1;
            background: #111827;
            border: 1px solid #2d3a5e;
            border-radius: 2rem;
            padding: 0.85rem 1.3rem;
            font-family: 'Inter', monospace;
            font-size: 0.9rem;
            color: #f1f5f9;
            resize: none;
            outline: none;
            max-height: 120px;
            transition: 0.2s;
        }

        .composer textarea:focus {
            border-color: #a78bfa;
        }

        .send-btn {
            background: radial-gradient(circle at 30% 10%, #8b5cf6, #4f46e5);
            width: 52px;
            height: 52px;
            border-radius: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 6px 14px #4f46e580;
        }

        .send-btn i {
            font-size: 1.4rem;
            color: white;
        }

        .send-btn:disabled {
            opacity: 0.5;
            transform: none;
            cursor: not-allowed;
            background: #475569;
            box-shadow: none;
        }

        .info-footer {
            text-align: center;
            font-size: 0.7rem;
            margin-top: 0.7rem;
            color: #5f6c8c;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .error-toast {
            background: #7f1a1aee;
            border-left: 4px solid #f97316;
            padding: 0.5rem 1rem;
            border-radius: 14px;
            font-size: 0.75rem;
            margin-bottom: 0.8rem;
            color: #ffe4e2;
            display: none;
        }
    </style>
</head>
<body>

<div class="aura-container" id="auraApp">
    <div class="aura-header">
        <div class="brand">
            <div class="aura-icon">
                <i class="fas fa-gem"></i>
            </div>
            <h1>AURA AI <span>by JLPG</span></h1>
        </div>
        <div class="key-badge">
            <div class="led-status">
                <div class="led" id="ledDot"></div>
                <span id="keyStateText">🔑 No Key</span>
            </div>
            <button class="action-btn" id="clearHistoryBtn" title="reset conversation"><i class="fas fa-eraser"></i> Clear</button>
        </div>
    </div>

    <div class="chat-messages" id="chatMessages">
        <!-- dynamic messages -->
    </div>

    <div class="input-panel">
        <div id="globalError" class="error-toast"></div>
        <div class="key-section">
            <div class="key-input-wrapper">
                <i class="fas fa-key"></i>
                <input type="password" id="apiKeyField" placeholder="Your Google Gemini API Key (get from aistudio.google.com)" autocomplete="off">
            </div>
            <button id="saveKeyBtn"><i class="fas fa-save"></i> Save & Connect</button>
        </div>
        <div class="composer">
            <textarea id="userMsgInput" rows="1" placeholder="Ask Aura AI anything ..." disabled></textarea>
            <button class="send-btn" id="sendMsgBtn" disabled><i class="fas fa-paper-plane"></i></button>
        </div>
        <div class="info-footer">
            <span><i class="fas fa-brain"></i> Powered by Gemini 2.0 Flash (free)</span>
            <span><i class="fas fa-lock"></i> Key stored locally · GitHub Pages ready</span>
        </div>
    </div>
</div>

<script>
    // ---------- AURA AI: Jlpg Edition ----------
    // using Google Gemini API (free tier)
    const GEMINI_BASE_URL = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent";

    // DOM elements
    const messagesDiv = document.getElementById('chatMessages');
    const apiKeyInput = document.getElementById('apiKeyField');
    const saveKeyBtn = document.getElementById('saveKeyBtn');
    const userInput = document.getElementById('userMsgInput');
    const sendBtn = document.getElementById('sendMsgBtn');
    const clearHistoryBtn = document.getElementById('clearHistoryBtn');
    const ledDot = document.getElementById('ledDot');
    const keyStateSpan = document.getElementById('keyStateText');
    const errorToast = document.getElementById('globalError');

    // State
    let apiKey = "";
    let conversationHistory = [];   // store { role: "user"/"model", content: string }
    let isLoading = false;

    // ---------- Helper UI ----------
    function showError(message, duration = 4500) {
        errorToast.innerText = message;
        errorToast.style.display = "block";
        setTimeout(() => {
            if (errorToast.innerText === message) errorToast.style.display = "none";
        }, duration);
    }

    function updateKeyUI() {
        if (apiKey && apiKey.trim().startsWith("AIza") && apiKey.length > 20) {
            ledDot.classList.add("active");
            keyStateSpan.innerHTML = '<i class="fas fa-check-circle"></i> Active';
            keyStateSpan.style.color = "#a7f3d0";
            userInput.disabled = false;
            sendBtn.disabled = false;
            userInput.placeholder = "✨ Message Aura AI ...";
        } else {
            ledDot.classList.remove("active");
            keyStateSpan.innerHTML = '⚠️ No API Key';
            keyStateSpan.style.color = "#fbcfe8";
            userInput.disabled = true;
            sendBtn.disabled = true;
            userInput.placeholder = "🔐 Set Gemini API key first (starts with AIza)";
            if (apiKey && apiKey.length > 0 && !apiKey.startsWith("AIza")) {
                showError("Invalid key format. Gemini keys start with 'AIza' from Google AI Studio.");
            }
        }
    }

    // load from localStorage
    function loadAPIKey() {
        const stored = localStorage.getItem("aura_gemini_key");
        if (stored && stored.startsWith("AIza")) {
            apiKey = stored;
            apiKeyInput.value = stored;
            updateKeyUI();
        } else {
            apiKey = "";
            apiKeyInput.value = "";
            updateKeyUI();
        }
    }

    function saveAPIKey() {
        let newKey = apiKeyInput.value.trim();
        if (!newKey) {
            showError("Please enter your Gemini API Key from Google AI Studio (aistudio.google.com)");
            return;
        }
        if (!newKey.startsWith("AIza")) {
            showError("❌ Wrong format: Gemini API keys start with 'AIza'. Get free key from Google AI Studio.");
            return;
        }
        apiKey = newKey;
        localStorage.setItem("aura_gemini_key", newKey);
        updateKeyUI();
        showError("✅ API key saved! Aura AI is ready.", 2500);
    }

    // chat storage
    function loadConversation() {
        const saved = localStorage.getItem("aura_conversation");
        if (saved) {
            try {
                let parsed = JSON.parse(saved);
                if (Array.isArray(parsed) && parsed.length > 0) {
                    conversationHistory = parsed;
                    renderMessages();
                    return;
                }
            } catch(e) { console.warn(e); }
        }
        // welcome message by Aura
        conversationHistory = [
            { role: "model", content: "✨ Hello, I'm **Aura AI** — created by JLPG. I use Google's Gemini AI. Set your API key above and let's create something amazing together. Ask me anything!" }
        ];
        renderMessages();
        persistConversation();
    }

    function persistConversation() {
        localStorage.setItem("aura_conversation", JSON.stringify(conversationHistory));
    }

    function renderMessages() {
        messagesDiv.innerHTML = "";
        for (let msg of conversationHistory) {
            const msgDiv = document.createElement("div");
            msgDiv.classList.add("message");
            if (msg.role === "user") {
                msgDiv.classList.add("user-msg");
            } else {
                msgDiv.classList.add("ai-msg");
            }
            const bubble = document.createElement("div");
            bubble.classList.add("bubble");
            // simple markdown style for bold / new lines
            let contentText = msg.content;
            if (msg.role === "model") {
                contentText = contentText.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");
                contentText = contentText.replace(/\n/g, "<br>");
                bubble.innerHTML = contentText;
            } else {
                bubble.textContent = contentText;
            }
            const timeSpan = document.createElement("div");
            timeSpan.classList.add("msg-time");
            const now = new Date();
            timeSpan.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            msgDiv.appendChild(bubble);
            msgDiv.appendChild(timeSpan);
            messagesDiv.appendChild(msgDiv);
        }
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function addMessage(role, content) {
        conversationHistory.push({ role, content });
        renderMessages();
        persistConversation();
    }

    function clearChat() {
        conversationHistory = [
            { role: "model", content: "🧹 Aura memory cleared. Ready to assist again! (API key still active). Ask away ✨" }
        ];
        renderMessages();
        persistConversation();
        showError("Conversation reset.", 1800);
    }

    // typing indicator
    let typingElement = null;
    function showTyping() {
        if (typingElement) removeTyping();
        const indicatorDiv = document.createElement("div");
        indicatorDiv.classList.add("message", "ai-msg");
        indicatorDiv.id = "typingIndicator";
        const bubbleWrap = document.createElement("div");
        bubbleWrap.classList.add("typing-indicator");
        bubbleWrap.innerHTML = `<span></span><span></span><span></span><span style="margin-left:6px; font-size:0.7rem;">Aura is thinking...</span>`;
        indicatorDiv.appendChild(bubbleWrap);
        messagesDiv.appendChild(indicatorDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
        typingElement = indicatorDiv;
    }

    function removeTyping() {
        if (typingElement) {
            typingElement.remove();
            typingElement = null;
        }
    }

    // Gemini API call
    async function sendToGemini(userMessage) {
        if (!apiKey || !apiKey.startsWith("AIza")) {
            showError("API key missing or invalid. Please save a valid Gemini key (AIza...)");
            return null;
        }

        // Build context: last 12 messages for good balance
        const historyContext = conversationHistory.slice(-12).map(msg => ({
            role: msg.role === "user" ? "user" : "model",
            parts: [{ text: msg.content }]
        }));

        const requestBody = {
            contents: [
                ...historyContext,
                { role: "user", parts: [{ text: userMessage }] }
            ],
            generationConfig: {
                temperature: 0.7,
                maxOutputTokens: 800,
                topP: 0.95
            }
        };

        try {
            const response = await fetch(`${GEMINI_BASE_URL}?key=${apiKey}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(requestBody)
            });

            if (!response.ok) {
                let errorDetail = "";
                try {
                    const errData = await response.json();
                    errorDetail = errData.error?.message || JSON.stringify(errData);
                } catch(e) { errorDetail = `HTTP ${response.status}`; }
                throw new Error(`Gemini error (${response.status}): ${errorDetail}`);
            }

            const data = await response.json();
            const aiText = data.candidates?.[0]?.content?.parts?.[0]?.text;
            if (!aiText) throw new Error("Empty response from Gemini");
            return aiText;
        } catch (err) {
            console.error(err);
            let friendly = `❌ Aura couldn't reach Gemini: ${err.message}`;
            if (err.message.includes("API key not valid") || err.message.includes("403")) {
                friendly = "🔐 Invalid Gemini API key. Please check your key at Google AI Studio and enable billing (free tier works).";
            } else if (err.message.includes("429")) {
                friendly = "⏳ Rate limit exceeded. Gemini free tier has limits. Try again in a moment.";
            }
            return friendly;
        }
    }

    // main send flow
    async function handleSendMessage() {
        if (isLoading) return;
        const rawMsg = userInput.value.trim();
        if (!rawMsg) return;
        if (!apiKey || !apiKey.startsWith("AIza")) {
            showError("First save your Gemini API key (AIza...). Get free key from aistudio.google.com");
            return;
        }

        // add user message to UI + history
        addMessage("user", rawMsg);
        userInput.value = "";
        userInput.style.height = "auto";

        isLoading = true;
        sendBtn.disabled = true;
        showTyping();

        const aiReply = await sendToGemini(rawMsg);

        removeTyping();

        if (aiReply) {
            addMessage("model", aiReply);
        } else {
            addMessage("model", "⚠️ Aura encountered a silence. Please check API key or network.");
        }

        isLoading = false;
        sendBtn.disabled = false;
        userInput.focus();
    }

    // auto-resize textarea
    function autoResizeTextarea() {
        userInput.style.height = "auto";
        userInput.style.height = Math.min(120, userInput.scrollHeight) + "px";
    }

    // event listeners
    saveKeyBtn.addEventListener("click", saveAPIKey);
    sendBtn.addEventListener("click", handleSendMessage);
    clearHistoryBtn.addEventListener("click", clearChat);
    userInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            if (!isLoading && sendBtn.disabled === false) handleSendMessage();
        }
    });
    userInput.addEventListener("input", autoResizeTextarea);

    // init app
    loadAPIKey();
    loadConversation();
    autoResizeTextarea();
    // if key already saved & no conversation, ensure chat is ready
    window.addEventListener("load", () => {
        if (apiKey && conversationHistory.length > 0) {
            userInput.disabled = false;
            sendBtn.disabled = false;
        }
    });
</script>
</body>
</html>
