<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aura AI - Made by JLPG</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#0f172a;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.chat-container{
width:90%;
max-width:900px;
height:90vh;
background:#111827;
border-radius:20px;
display:flex;
flex-direction:column;
overflow:hidden;
}

.header{
background:linear-gradient(90deg,#00c6ff,#0072ff);
padding:15px;
text-align:center;
}

.chat-box{
flex:1;
padding:15px;
overflow-y:auto;
}

.message{
padding:10px;
margin:10px 0;
border-radius:10px;
max-width:80%;
}

.user{
background:#2563eb;
margin-left:auto;
}

.bot{
background:#1f2937;
}

.input-area{
display:flex;
padding:10px;
gap:10px;
background:#0b1220;
}

#message{
flex:1;
padding:12px;
border:none;
border-radius:10px;
}

button{
padding:12px 20px;
border:none;
border-radius:10px;
cursor:pointer;
background:#00c6ff;
color:white;
}

.footer{
text-align:center;
padding:8px;
font-size:12px;
color:#9ca3af;
}
</style>

</head>
<body>

<div class="chat-container">

<div class="header">
<h2>✨ Aura AI</h2>
<p>Made by JLPG 🚀</p>
</div>

<div class="chat-box" id="chatBox">
<div class="message bot">
Hello! I am Aura AI 👋
</div>
</div>

<div class="input-area">
<input type="text" id="message" placeholder="Type a message...">
<button onclick="sendMessage()">Send</button>
</div>

<div class="footer">
Aura AI © JLPG
</div>

</div>

<script>
function sendMessage(){

let input = document.getElementById("message");
let text = input.value;

if(text.trim()=="") return;

let chatBox = document.getElementById("chatBox");

chatBox.innerHTML += `
<div class="message user">${text}</div>
`;

chatBox.innerHTML += `
<div class="message bot">Demo Response</div>
`;

input.value="";
chatBox.scrollTop = chatBox.scrollHeight;
}
</script>

</body>
</html>
